<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>X-Men Wrapped 2026 - Hair & Scalp Quiz</title>

  <!-- Figma-compliant Google Fonts Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Abel&family=Amita:wght@700&family=Anek+Odia:wght@400;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0c0c0c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* 1. Standard mobile 9:16 Story viewport (380x675) */
    .story-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 675px;
      border-radius: 36px;
      overflow: hidden;
      background-color: #292929;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
      border: 1px solid #333333;
    }

    /* ================= SCREEN CORNER CONTOUR AMBIENT GLOW EFFECT ================= */
    .top-contour-beam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      pointer-events: none;
      z-index: 250;
      overflow: visible;
    }
    .contour-track {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
    }
    .contour-laser {
      fill: none;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 120 480;
      stroke-dashoffset: 480;
      animation: laserTravel 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite,
                 laserColorLoop 5s ease-in-out infinite;
    }
    @keyframes laserTravel {
      0% {
        stroke-dashoffset: 480;
        stroke-dasharray: 40 480;
        opacity: 0.15;
      }
      40% {
        stroke-dasharray: 180 480;
        opacity: 0.95;
      }
      75% {
        stroke-dashoffset: -120;
        stroke-dasharray: 110 480;
        opacity: 0.85;
      }
      100% {
        stroke-dashoffset: -480;
        stroke-dasharray: 30 480;
        opacity: 0.1;
      }
    }
    @keyframes laserColorLoop {
      0%, 100% {
        stroke: #CFB23C;
        filter: drop-shadow(0 0 10px rgba(207, 178, 60, 0.85)) drop-shadow(0 0 3px #FFF);
      }
      33% {
        stroke: #BEE860;
        filter: drop-shadow(0 0 10px rgba(190, 232, 96, 0.85)) drop-shadow(0 0 3px #FFF);
      }
      66% {
        stroke: #FFFFFF;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 4px #BEE860);
      }
    }

    /* 2. Native Figma 1080x1920 coordinate reference canvas */
    .figma-world {
      position: absolute;
      width: 1080px;
      height: 1920px;
      transform: scale(0.35185);
      transform-origin: top left;
      pointer-events: auto;
    }

    /* ================= SCREEN SECTION CONTAINERS ================= */
    #entry-section {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    #quiz-section {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
      display: none;
    }

    /* ================= STYLE ENTRY ONBOARDING ================= */
    .badge-frame {
      position: absolute;
      width: 597.21px;
      height: 84px;
      left: 238.34px;
      top: 54.9px;
      background: #292929;
      box-shadow: -25px -22px 4px rgba(93, 93, 93, 0.3);
      transform: rotate(-1deg);
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 10;
    }
    .badge-title {
      width: 100%;
      font-family: 'Anek Odia', sans-serif;
      font-style: normal;
      font-weight: 700;
      font-size: 70px;
      line-height: 84px;
      text-align: center;
      letter-spacing: -0.06em;
      color: #FFD600;
      white-space: nowrap;
      transform: none;
      display: block;
    }

    .transparent-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 700;
      font-size: 48px;
      color: #292929;
      position: absolute;
      z-index: 5;
    }
    .transparent-input::placeholder {
      color: rgba(41, 41, 41, 0.38);
      font-size: 52px;
      font-weight: 800;
      transition: opacity 0.15s ease;
    }
    .transparent-input:focus::placeholder {
      opacity: 0;
    }

    .next-arrow-btn {
      position: absolute;
      width: 115px;
      height: 116px;
      left: 935px;
      top: 1762px;
      cursor: pointer;
      z-index: 25;
      transition: transform 0.15s ease;
    }
    .next-arrow-btn:active {
      transform: scale(0.94);
    }

    /* ================= QUIZ CONTENT SCROLL / SLIDE VIEWPORT ================= */
    #question-card-wrapper {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1680px;
      z-index: 20;
      transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slide-enter-right {
      animation: animEnterRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-exit-left {
      animation: animExitLeft 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-enter-left {
      animation: animEnterLeft 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-exit-right {
      animation: animExitRight 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes animEnterRight {
      from { opacity: 0; transform: translateX(120px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes animExitLeft {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-120px); }
    }
    @keyframes animEnterLeft {
      from { opacity: 0; transform: translateX(-120px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes animExitRight {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(120px); }
    }

    /* ================= TYPOGRAPHY & HEADER ELEMENTS ================= */
    .dim-large-title {
      position: absolute;
      width: 733px;
      height: 96px;
      left: 308px;
      top: 101px;
      font-family: 'Anek Odia', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 150px;
      line-height: 252px;
      letter-spacing: -0.06em;
      color: #F0F0EB;
      text-shadow: 17px 23px 0.2px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      display: flex;
      align-items: center;
      z-index: 10;
    }
    .dim-sub-title {
      position: absolute;
      width: 340px;
      height: 50px;
      left: 700px;
      top: 241px;
      font-family: 'Abel', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 50px;
      line-height: 44px;
      text-align: right;
      letter-spacing: -0.06em;
      color: #D5B108;
      white-space: nowrap;
      z-index: 10;
    }
    .quiz-question-text {
      position: absolute;
      width: 808.28px;
      height: 150px;
      left: 136.01px;
      top: 438px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 54px;
      line-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      letter-spacing: -0.06em;
      color: #F0F0EB;
      transform: rotate(0.14deg);
      z-index: 10;
    }

    /* ================= QUIZ OPTION SELECTION CONTAINER ================= */
    .quiz-option-item {
      cursor: pointer;
      z-index: 30;
      pointer-events: auto;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .quiz-option-item:hover {
      filter: brightness(1.2);
    }
    .quiz-option-item:active {
      transform: scale(0.96);
    }
    .quiz-option-item.selected .opt-card-body {
      border-color: #CFB23C !important;
      background: #3b3726 !important;
      box-shadow: -111px 20px 0px rgba(207, 178, 60, 0.95) !important;
    }
    .quiz-option-item.selected .opt-num {
      color: #000000 !important;
    }

    .opt-card-body {
      box-sizing: border-box;
      position: absolute;
      width: 690.14px;
      height: 144px;
      background: #303030;
      border: 2px solid #BABABA;
      box-shadow: -111px 20px 0px rgba(186, 186, 186, 0.95);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .opt-text-label {
      position: absolute;
      width: 562.43px;
      height: 51px;
      left: 63.8px;
      top: 45.84px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 40px;
      line-height: 51px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      letter-spacing: -0.06em;
      color: #F0F0EB;
      transform: rotate(0.14deg);
      pointer-events: none;
    }
    .opt-num {
      position: absolute;
      width: 39.33px;
      height: 155px;
      font-family: 'Amita', cursive;
      font-style: normal;
      font-weight: 700;
      font-size: 80px;
      line-height: 155px;
      text-align: center;
      letter-spacing: -0.06em;
      color: #292929;
      pointer-events: none;
    }

    /* ================= BACK NAVIGATION BUTTON ================= */
    .btn-back-group {
      position: absolute;
      width: 298px;
      height: 101px;
      left: 389px;
      top: 1688px;
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      transition: transform 0.15s ease, filter 0.15s ease;
      background: transparent;
      border: none;
      outline: none;
    }
    .btn-back-group:active {
      transform: scale(0.95);
    }
    .btn-back-group:hover {
      filter: brightness(1.25);
    }
    .genre-container {
      box-sizing: border-box;
      position: absolute;
      width: 247.92px;
      height: 84.31px;
      left: 50.08px;
      top: 8.35px;
      border-width: 2px 2px 2px 0px;
      border-style: solid;
      border-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .genre-text {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 37px;
      line-height: 47px;
      letter-spacing: -0.06em;
      color: #F0F0EB;
      transform: rotate(0.14deg);
      margin-left: 20px;
      white-space: nowrap;
    }
    .arrow-circle {
      position: absolute;
      width: 101px;
      height: 101px;
      left: 0;
      top: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================= LOADING OVERLAYS ================= */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 12, 0.92);
      backdrop-filter: blur(14px);
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .rhombus-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rhombus-outer {
      width: 110px;
      height: 110px;
      border: 3.5px solid #CFB23C;
      transform: rotate(45deg);
      animation: spinRhombus 3.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      box-shadow: 0 0 30px rgba(207, 178, 60, 0.35);
    }
    .rhombus-inner {
      position: absolute;
      width: 65px;
      height: 65px;
      border: 2px solid rgba(240, 240, 235, 0.65);
      transform: rotate(45deg);
      animation: spinRhombusRev 2.2s linear infinite;
    }

    @keyframes spinRhombus {
      0% { transform: rotate(45deg); }
      50% { transform: rotate(225deg); }
      100% { transform: rotate(405deg); }
    }
    @keyframes spinRhombusRev {
      0% { transform: rotate(45deg); }
      100% { transform: rotate(-315deg); }
    }

    .loading-status-title {
      font-family: 'Anek Odia', sans-serif;
      font-size: 50px;
      color: #CFB23C;
      margin-top: 60px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }
    .loading-status-sub {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 32px;
      color: #A3A3A3;
      margin-top: 14px;
      text-align: center;
      max-width: 780px;
      line-height: 1.4;
      font-weight: 400;
    }
  </style>
</head>

  <script>
    const OPTION_KEYS = ['A', 'B', 'C', 'D', 'E'];
    
    const DIMENSION_CONFIG = {
      "ROOT EXPOSURE": { letter: "DIMENSION A", title: "Root Exposure" },
      "CURRENT CONDITION": { letter: "DIMENSION B", title: "Current Condition" },
      "GROOMING BEHAVIOR": { letter: "DIMENSION C", title: "Grooming Behavior" },
      "GROOMING MINDSET": { letter: "DIMENSION D", title: "Grooming Mindset" },
      "root_exposure": { letter: "DIMENSION A", title: "Root Exposure" },
      "current_condition": { letter: "DIMENSION B", title: "Current Condition" },
      "grooming_behavior": { letter: "DIMENSION C", title: "Grooming Behavior" },
      "grooming_mindset": { letter: "DIMENSION D", title: "Grooming Mindset" }
    };

    function resolveDimension(q, idx) {
      if (q && q.dimension && DIMENSION_CONFIG[q.dimension]) {
        return DIMENSION_CONFIG[q.dimension];
      }
      const raw = (q && q.dimension ? q.dimension : '').toUpperCase();
      if (raw.includes("EXPOSURE") || idx === 0 || idx === 1) return { letter: "DIMENSION A", title: "Root Exposure" };
      if (raw.includes("CONDITION") || idx === 2 || idx === 3) return { letter: "DIMENSION B", title: "Current Condition" };
      if (raw.includes("BEHAVIOR") || idx === 4 || idx === 5) return { letter: "DIMENSION C", title: "Grooming Behavior" };
      if (raw.includes("MINDSET") || idx === 6) return { letter: "DIMENSION D", title: "Grooming Mindset" };
      return { letter: "DIMENSION A", title: "Root Exposure" };
    }

    function getFallbackQuestions() {
      return [
        { id: "Q1", dimension: "ROOT EXPOSURE", question: "Ngày thường, bạn thường đội mũ bảo hiểm khoảng bao lâu?", options: [ {key: "A", label: "Dưới 30 phút"}, {key: "B", label: "30 phút – 1 giờ"}, {key: "C", label: "1 – 2 giờ"}, {key: "D", label: "Hơn 2 giờ"} ] },
        { id: "Q2", dimension: "ROOT EXPOSURE", question: "Phần lớn một ngày của bạn diễn ra ở đâu?", options: [ {key: "A", label: "Phòng máy lạnh cả ngày"}, {key: "B", label: "Trong nhà nhưng hay ra đường"}, {key: "C", label: "Ngoài trời khá nhiều"}, {key: "D", label: "Ngoài trời / vận động nhiều"} ] },
        { id: "Q3", dimension: "CURRENT CONDITION", question: "Cuối ngày, tình trạng da đầu của bạn giống nhất với mô tả nào?", options: [ {key: "A", label: "Vẫn sạch và khô thoáng"}, {key: "B", label: "Hơi bết nhưng không khó chịu"}, {key: "C", label: "Bết rõ, tóc dễ xẹp"}, {key: "D", label: "Bết + ngứa / khó chịu"}, {key: "E", label: "Có vảy/gàu nhìn thấy được"} ] },
        { id: "Q4", dimension: "CURRENT CONDITION", question: "Sau khi gội đầu, bạn thường thấy bao nhiêu tóc rụng?", options: [ {key: "A", label: "Gần như không thấy"}, {key: "B", label: "Có vài sợi, bình thường"}, {key: "C", label: "Khá nhiều, bắt đầu để ý"}, {key: "D", label: "Nhiều đến mức thực sự lo"} ] },
        { id: "Q5", dimension: "GROOMING BEHAVIOR", question: "Khi chọn sản phẩm grooming, thứ bạn nhìn vào đầu tiên là gì?", options: [ {key: "A", label: "Mùi thơm — thơm là thắng"}, {key: "B", label: "Cảm giác mát lạnh sau dùng"}, {key: "C", label: "Công dụng (sạch, giảm dầu/gàu)"}, {key: "D", label: "Thành phần hoạt chất"}, {key: "E", label: "Combo cả công dụng + thành phần"} ] },
        { id: "Q6", dimension: "GROOMING BEHAVIOR", question: "Nếu chai dầu gội hiện tại hết hôm nay, bạn sẽ...", options: [ {key: "A", label: "Lấy đại chai khác trong nhà dùng"}, {key: "B", label: "Mua đúng chai cũ"}, {key: "C", label: "Ra tiệm chọn chai có mùi thích"}, {key: "D", label: "Tìm sản phẩm giải quyết đúng vấn đề"}, {key: "E", label: "Check thành phần rồi mới mua"} ] },

      ];
    }

    let questions = getFallbackQuestions();

    let currentSessionId = `xmen_${Math.random().toString(36).substring(2, 10)}`;

    const MAX_VOL = 0.65;
    const FADE_START = 55.0;

    async function initQuizEngine() {
    const loading = document.getElementById('loadingOverlay');
    const titleEl = document.getElementById('loadingTitle');
    const subEl = document.getElementById('loadingSub');

    titleEl.innerText = "ĐANG TẢI DỮ LIỆU...";
    subEl.innerText = "Hệ thống đang chuẩn bị tài nguyên và bài hát độc bản...";

    try {
        // IDEMPOTENT: Invoke init-session EXACTLY ONCE here
        const sessRes = await fetch('/api/quiz/init-session');
        if (sessRes.ok) {
        const sessData = await sessRes.json();
        if (sessData.session_id) currentSessionId = sessData.session_id;
        if (sessData.track) {
            assignedTrack = sessData.track;
            // PERSIST SINGLE SOURCE OF TRUTH (SSOT) TO LOCALSTORAGE
            localStorage.setItem('xmen_assigned_track', JSON.stringify(assignedTrack));
        }
        }
    } catch (e) {
        console.warn("Chưa khởi tạo session trước, dùng fallback:", e);
    }

    if (assignedTrack && (assignedTrack.full_url || assignedTrack.cut_url)) {
        try {
        const trackUrl = assignedTrack.full_url || assignedTrack.cut_url;
        bgAudio = new Audio(trackUrl);
        bgAudio.preload = 'auto';
        bgAudio.volume = 0.05;

        bgAudio.addEventListener('timeupdate', () => {
            if (!bgAudio) return;
            const t = bgAudio.currentTime;

            if (t >= LOOP_LIMIT) {
            bgAudio.currentTime = 0;
            bgAudio.volume = 0.05;
            return;
            }

            if (t < 4.0) {
            bgAudio.volume = Math.max(0.05, Math.min(MAX_VOL, (t / 4.0) * MAX_VOL));
            } else if (t >= FADE_START) {
            const fadePct = (t - FADE_START) / (LOOP_LIMIT - FADE_START);
            bgAudio.volume = Math.max(0.05, (1 - fadePct) * MAX_VOL);
            } else {
            bgAudio.volume = MAX_VOL;
            }
        });

        bgAudio.play().then(() => { isAudioUnlocked = true; }).catch(() => {});
        } catch (err) {
        console.warn("Lỗi setup audio:", err);
        }
    }

    const unlockMusic = () => {
        if (bgAudio && !isAudioUnlocked) {
        bgAudio.play().then(() => { isAudioUnlocked = true; }).catch(() => {});
        }
        window.removeEventListener('click', unlockMusic);
        window.removeEventListener('touchstart', unlockMusic);
    };
    window.addEventListener('click', unlockMusic);
    window.addEventListener('touchstart', unlockMusic);

    try {
        const qRes = await fetch('/api/quiz/questions');
        if (qRes.ok) {
        const qData = await qRes.json();
        if (qData.questions && qData.questions.length > 0) {
            questions = qData.questions;
        }
        }
    } catch (err) {
        console.warn("Dùng fallback questions:", err);
    }

    const nameInput = document.getElementById('entryNameInput');
    const ageInput = document.getElementById('entryAgeInput');
    if (nameInput && localStorage.getItem('xmen_user_name')) nameInput.value = localStorage.getItem('xmen_user_name');
    if (ageInput && localStorage.getItem('xmen_user_age')) ageInput.value = localStorage.getItem('xmen_user_age');

    setTimeout(() => {
        loading.classList.remove('active');
    }, 1500);
    }

    function startQuizFlow() {
      if (bgAudio && !isAudioUnlocked) {
        bgAudio.play().then(() => { isAudioUnlocked = true; }).catch(() => {});
      }

      const nameInput = document.getElementById('entryNameInput');
      const ageInput = document.getElementById('entryAgeInput');

      // Directly retrieve value from active input node
      const rawName = nameInput ? nameInput.value.trim() : "";
      const rawAge = ageInput ? ageInput.value.trim() : "";

      userName = rawName ? rawName : "Chiến thần Deadline";
      userAge = rawAge ? parseInt(rawAge, 10) : 24;

      // Force-sync state into LocalStorage immediately
      localStorage.setItem('xmen_user_name', userName);
      localStorage.setItem('xmen_user_age', userAge.toString());

      const entrySection = document.getElementById('entry-section');
      const quizSection = document.getElementById('quiz-section');

      entrySection.style.opacity = '0';
      entrySection.style.transform = 'translateX(-120px)';

      setTimeout(() => {
        entrySection.style.display = 'none';
        quizSection.style.display = 'block';
        currentIndex = 0;
        renderQuestion(0, 'enter-right');
      }, 250);
    }

    function renderQuestion(idx, animDirection = 'enter-right') {
      const q = questions[idx];
      if (!q) return;

      const wrapper = document.getElementById('question-card-wrapper');
      if (wrapper) {
        wrapper.className = animDirection === 'enter-right' ? 'slide-enter-right' : 'slide-enter-left';
      }

      const dimInfo = resolveDimension(q, idx);
      document.getElementById('val-dimension-letter').innerText = dimInfo.letter;
      document.getElementById('val-dimension-title').innerText = dimInfo.title;

      const cleanText = q.question.trim().replace(/^["“]+|["”]+$/g, '');
      document.getElementById('val-question-text').innerText = `“${cleanText}”`;

      const opts = q.options || [];
      for (let i = 0; i < 5; i++) {
        const box = document.getElementById(`option-box-${i}`);
        const txt = document.getElementById(`opt-text-${i}`);
        if (!box) continue;

        box.classList.remove('selected');

        if (i < opts.length) {
          box.style.display = 'block';
          if (txt) txt.innerText = opts[i].label;

          if (userAnswers[q.id] === OPTION_KEYS[i]) {
            box.classList.add('selected');
          }
        } else {
          box.style.display = 'none';
        }
      }

      isTransitioning = false;
    }

    function onOptionClick(optionIdx) {
      if (isTransitioning) return;
      isTransitioning = true;

      try {
        if (bgAudio && !isAudioUnlocked) {
          bgAudio.play().then(() => { isAudioUnlocked = true; }).catch(() => {});
        }

        const currentQ = questions[currentIndex];
        const chosenKey = OPTION_KEYS[optionIdx];
        if (currentQ) {
          userAnswers[currentQ.id] = chosenKey;
        }

        for (let i = 0; i < 5; i++) {
          const el = document.getElementById(`option-box-${i}`);
          if (el) el.classList.toggle('selected', i === optionIdx);
        }

        setTimeout(() => {
          if (currentIndex < questions.length - 1) {
            const wrapper = document.getElementById('question-card-wrapper');
            if (wrapper) wrapper.className = 'slide-exit-left';
            setTimeout(() => {
              currentIndex++;
              renderQuestion(currentIndex, 'enter-right');
            }, 200);
          } else {
            submitQuizToEngine();
          }
        }, 220);

      } catch (err) {
        console.error("Lỗi khi chọn đáp án:", err);
        isTransitioning = false;
      }
    }

    function handleBackAction() {
      if (isTransitioning) return;

      if (currentIndex > 0) {
        isTransitioning = true;
        const wrapper = document.getElementById('question-card-wrapper');
        if (wrapper) wrapper.className = 'slide-exit-right';
        setTimeout(() => {
          currentIndex--;
          renderQuestion(currentIndex, 'enter-left');
        }, 200);
      } else {
        const entrySection = document.getElementById('entry-section');
        const quizSection = document.getElementById('quiz-section');

        quizSection.style.display = 'none';
        entrySection.style.display = 'block';

        setTimeout(() => {
          entrySection.style.opacity = '1';
          entrySection.style.transform = 'translateX(0)';
        }, 20);
      }
    }

    // Submit diagnostic payload & poll background worker status
    async function submitQuizToEngine() {
      const loading = document.getElementById('loadingOverlay');
      if (loading) loading.classList.add('active');

      const titleEl = document.getElementById('loadingTitle');
      const subEl = document.getElementById('loadingSub');
      if (titleEl) titleEl.innerText = "ĐANG ĐỒNG BỘ DỮ LIỆU...";
      if (subEl) subEl.innerText = "Hệ thống đang lưu hồ sơ bản lĩnh của bạn...";

      const latestStoredAge = localStorage.getItem('xmen_user_age');
      if (latestStoredAge) userAge = parseInt(latestStoredAge, 10);
      const latestStoredName = localStorage.getItem('xmen_user_name');
      if (latestStoredName) userName = latestStoredName;

      // 1. Client-side fallback scalp stress age computation
      let exposurePoints = 0;
      const q1Ans = userAnswers['Q1'] || 'B';
      const q2Ans = userAnswers['Q2'] || 'B';
      const pts = {'A': 1, 'B': 2, 'C': 3, 'D': 4};
      exposurePoints = (pts[q1Ans] || 2) + (pts[q2Ans] || 2);

      let expDelta = exposurePoints <= 3 ? -2 : (exposurePoints <= 5 ? 1 : (exposurePoints <= 7 ? 3 : 5));
      const q4Ans = userAnswers['Q4'] || 'B';
      const fallDeltaMap = {'A': -1, 'B': 0, 'C': 2, 'D': 4};
      let fallDelta = fallDeltaMap[q4Ans] !== undefined ? fallDeltaMap[q4Ans] : 0;

      let localDeltaAge = Math.min(9, Math.max(-3, expDelta + fallDelta));
      let localHairStressAge = Math.max(1, userAge + localDeltaAge);

      localStorage.setItem('xmen_delta_age', localDeltaAge.toString());
      localStorage.setItem('xmen_hair_stress_age', localHairStressAge.toString());

      const payload = {
        session_id: currentSessionId,
        track_id: assignedTrack ? assignedTrack.id : null,
        user_name: userName,
        user_age: userAge,
        answers: userAnswers
      };

      try {
        const res = await fetch('/api/quiz/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const data = await res.json();
        const activeSid = (data && data.session_id) ? data.session_id : currentSessionId;

        // Database persistence confirmed -> Await 1s transition delay before routing to Story
        setTimeout(() => {
          finishFlow(activeSid);
        }, 1000);

      } catch (err) {
        console.error("Lỗi khi gửi bài test:", err);
        if (titleEl) titleEl.innerText = "MẠNG CHẬP CHỜN";
        if (subEl) subEl.innerText = "Không thể gửi dữ liệu lên máy chủ. Vui lòng bấm thử lại!";
        setTimeout(() => {
          if (confirm("Chưa lưu được kết quả lên server do mạng yếu. Bạn có muốn bấm gửi lại không?")) {
            submitQuizToEngine();
          } else {
            if (loading) loading.classList.remove('active');
          }
        }, 600);
      }
    }

    function finishFlow(targetSession) {
      const titleEl = document.getElementById('loadingTitle');
      const subEl = document.getElementById('loadingSub');
      if (titleEl) titleEl.innerText = "HOÀN TẤT WRAPPED!";
      if (subEl) subEl.innerText = "Đang chuyển vào trải nghiệm Story âm nhạc...";

      if (bgAudio) {
        try {
          let fadeOut = setInterval(() => {
            if (bgAudio && bgAudio.volume > 0.06) {
              bgAudio.volume = Math.max(0, bgAudio.volume - 0.05);
            } else {
              if (bgAudio) {
                bgAudio.volume = 0;
                bgAudio.pause();
              }
              clearInterval(fadeOut);
            }
          }, 40);
        } catch (e) {
          bgAudio.pause();
        }
      }

      setTimeout(() => {
        window.location.href = `/index2.html?session=${encodeURIComponent(targetSession)}`;
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', initQuizEngine);
  </script>
</body>
